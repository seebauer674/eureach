<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — eureach.eu</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .post-page{max-width:760px;margin:0 auto;padding:100px 24px 80px}
    .post-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:0.85rem;margin-bottom:32px;text-decoration:none}
    .post-back:hover{color:var(--white)}
    .post-img{width:100%;max-height:380px;object-fit:cover;border-radius:16px;margin-bottom:32px}
    .post-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .post-lang{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);color:#60a5fa;border-radius:20px;padding:3px 10px}
    .post-cat{font-size:0.78rem;color:var(--muted)}
    .post-date{font-size:0.78rem;color:var(--muted)}
    .post-author{font-size:0.78rem;color:var(--muted)}
    .post-title{font-size:2rem;font-weight:800;color:var(--white);line-height:1.25;margin-bottom:24px}
    .post-excerpt{font-size:1.05rem;color:var(--muted);line-height:1.7;margin-bottom:32px;border-left:3px solid var(--blue);padding-left:16px}
    .post-content{color:var(--text);line-height:1.8;font-size:0.97rem;word-break:break-word}
    .post-content h1,.post-content h2,.post-content h3{color:var(--white);margin:28px 0 12px;line-height:1.3}
    .post-content p{margin:0 0 16px}
    .post-cta{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);border-radius:16px;padding:32px;margin-top:48px;text-align:center}
    .post-cta h3{color:var(--white);margin-bottom:8px}
    .post-cta p{color:var(--muted);font-size:0.88rem;margin-bottom:20px}
    .post-404{text-align:center;padding:80px 24px;color:var(--muted)}
  </style>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>
<nav id="nav" class="app-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">eureach<span class="dot">.</span>eu</a>
    <div class="nav-links">
      <a href="leads.html" data-i18n="nav.leads">Lead Finder</a>
      <a href="articles.html" data-i18n="nav.articles">Articles</a>
      <a href="fb-posts.html" data-i18n="nav.fb_posts">FB Posts</a>
      <a href="templates.html" data-i18n="nav.templates">Templates</a>
      <a href="blog.html" style="color:var(--white)">Blog</a>
      <a href="membership.html" data-i18n="nav.membership">Membership</a>
    
      <a href="citations.html">Citations</a>
    
      <a id="nav-creator-link" href="youtube.html" style="display:none">Creator Portal</a>
      <a href="/dashboard.html" style="color:var(--accent);font-weight:600" data-i18n="nav.dashboard">Dashboard</a>
    </div>
    <div class="nav-cta">
      <a href="profile.html" class="btn btn-ghost" style="font-size:0.78rem;padding:7px 14px;display:none">&#128100; My Profile</a>
      <a href="signin.html" class="btn btn-ghost" style="font-size:0.78rem;padding:7px 14px" data-i18n="nav.sign_in">Sign in</a>
      <a href="signup.html" class="btn btn-primary" style="font-size:0.78rem;padding:7px 14px">Start free &rarr;</a>
    </div>
  </div>
</nav>
<div class="post-page" id="post-wrap">
  <p style="color:var(--muted);padding:60px 0">Loading&hellip;</p>
</div>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
(async function(){
  var slug=new URLSearchParams(window.location.search).get('slug');
  var wrap=document.getElementById('post-wrap');
  if(!slug){wrap.innerHTML='<div class="post-404">Article not found.</div>';return;}
  var res=await fetch('/api/blog/'+encodeURIComponent(slug)).then(function(r){return r.json()}).catch(function(){return{}});
  var p=res.post;
  if(!p){wrap.innerHTML='<div class="post-404">Article not found. <a href="blog.html" style="color:#60a5fa">Back to blog</a></div>';return;}
  document.title=p.title+' — eureach.eu';
  var date=p.publishedAt?new Date(p.publishedAt).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}):'';
  var img=p.featuredImage?'<img class="post-img" src="'+esc(p.featuredImage)+'" alt="'+esc(p.title)+'">':'';
  wrap.innerHTML=
    '<a class="post-back" href="blog.html">&larr; Back to Blog</a>'+
    img+
    '<div class="post-meta">'+
      '<span class="post-lang">'+(p.language||'').toUpperCase()+'</span>'+
      '<span class="post-cat">'+esc(p.category||'')+'</span>'+
      '<span class="post-date">'+esc(date)+'</span>'+
      '<span class="post-author">by '+esc(p.author||'eureach team')+'</span>'+
    '</div>'+
    '<h1 class="post-title">'+esc(p.title)+'</h1>'+
    (p.excerpt?'<div class="post-excerpt">'+esc(p.excerpt)+'</div>':'')+
    '<div class="post-content">'+(p.content||p.html||'')+'</div>'+
    '<div class="post-cta">'+
      '<h3>Start generating leads &amp; content today</h3>'+
      '<p>Find local business leads, write SEO articles in 3 languages, and grow faster with AI.</p>'+
      '<a href="signup.html" class="btn btn-primary btn-lg">Start free &mdash; no card needed &rarr;</a>'+
    '</div>';
})();
</script>
<script src="js/nav-init.js?v=5"></script>
</body>
</html>

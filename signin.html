<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — eureach.eu</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="js/translations.js?v=7"></script>
  <script src="js/i18n.js?v=5"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 40px;
      position: relative;
      overflow: hidden;
    }
    .auth-blob-1 {
      position: absolute; border-radius: 50%;
      filter: blur(100px); opacity: 0.12; pointer-events: none;
      width: 500px; height: 500px; background: var(--blue);
      top: -120px; right: -80px;
    }
    .auth-blob-2 {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.1; pointer-events: none;
      width: 350px; height: 350px; background: var(--purple);
      bottom: -80px; left: -60px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 40px 36px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }
    .auth-logo {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }
    .auth-logo span { color: var(--gold); }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-align: center;
    }
    .auth-sub {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-sub a { color: var(--blue2); transition: color 0.2s; }
    .auth-sub a:hover { color: var(--white); }
    .auth-field {
      margin-bottom: 16px;
    }
    .auth-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .auth-field input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 0.9rem;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .auth-field input::placeholder { color: #475569; }
    .auth-field input:focus {
      border-color: rgba(37,99,235,0.6);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .auth-field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .auth-field-row label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .auth-forgot {
      font-size: 0.78rem;
      color: var(--blue2);
      transition: color 0.2s;
    }
    .auth-forgot:hover { color: var(--white); }
    .auth-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: var(--white);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(37,99,235,0.35);
      font-family: inherit;
    }
    .auth-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(37,99,235,0.5);
    }
    .auth-submit:active { transform: none; }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .auth-divider span {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .auth-bottom {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 24px;
    }
    .auth-bottom a { color: var(--blue2); font-weight: 600; transition: color 0.2s; }
    .auth-bottom a:hover { color: var(--white); }
    .auth-error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #f87171;
      margin-bottom: 16px;
    }
    .auth-error.visible { display: block; }
  </style>
</head>
<body>

<nav id="nav" class="app-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">eureach<span class="dot">.</span>eu</a>
    <div class="nav-lang">
      <button class="lang-btn" data-lang="el" onclick="setLang('el')" title="Ελληνικά">🇬🇷</button>
      <button class="lang-btn" data-lang="de" onclick="setLang('de')" title="Deutsch">🇩🇪</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')" title="English">🇬🇧</button>
      <a href="/dashboard.html" style="color:var(--accent);font-weight:600" data-i18n="nav.dashboard">Dashboard</a>
    </div>
    <div class="nav-cta">
      <a href="signup.html" class="btn btn-primary" data-i18n="navCreate">Create account →</a>
    </div>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-blob-1"></div>
  <div class="auth-blob-2"></div>

  <div class="auth-card">
    <div class="auth-logo">eureach<span>.</span>eu</div>
    <h1 class="auth-title" data-i18n="siTitle">Welcome back</h1>
    <p class="auth-sub"><span data-i18n="siSub">Don't have an account?</span> <a href="signup.html" data-i18n="siSignupLink">Sign up free →</a></p>

    <div class="auth-error" id="auth-error"></div>

    <form id="signin-form" onsubmit="handleSignin(event)">

      <div class="auth-field">
        <label for="email" data-i18n="siEmail">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="auth-field">
        <div class="auth-field-row">
          <label for="password" data-i18n="siPassword">Password</label>
          <a href="mailto:hello@eureach.eu?subject=Password%20Reset%20Request" class="auth-forgot" data-i18n="siForgot">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="auth-submit" id="submit-btn" data-i18n="siSubmit">Sign in →</button>

    </form>

    <div class="auth-divider"><span data-i18n="siOr">or</span></div>

    <div class="auth-bottom">
      <span data-i18n="siNewTo">New to eureach?</span> <a href="signup.html" data-i18n="siCreateFree">Create a free account</a>
    </div>
  </div>
</main>

<script>
async function handleSignin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('auth-error');
  const btnLabel = btn.textContent;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Signing in…';
  errEl.classList.remove('visible');

  try {
    const res = await fetch('/api/auth/signin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sign in failed');
    const next = new URLSearchParams(location.search).get('next') || 'dashboard.html';
    location.href = next;
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('visible');
    btn.disabled = false;
    btn.textContent = btnLabel;
  }
}

// Scroll effect on nav
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
});
</script>
<script src="/js/api.js?v=5"></script>
</body>
</html>

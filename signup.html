<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — eureach.eu</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 40px;
      position: relative;
      overflow: hidden;
    }
    .auth-blob-1 {
      position: absolute; border-radius: 50%;
      filter: blur(100px); opacity: 0.12; pointer-events: none;
      width: 500px; height: 500px; background: var(--purple);
      top: -100px; left: -80px;
    }
    .auth-blob-2 {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.1; pointer-events: none;
      width: 400px; height: 400px; background: var(--blue);
      bottom: -60px; right: -60px;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 40px 36px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }
    .auth-logo {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }
    .auth-logo span { color: var(--gold); }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-align: center;
    }
    .auth-sub {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-sub a { color: var(--blue2); transition: color 0.2s; }
    .auth-sub a:hover { color: var(--white); }

    /* Plan pill */
    .plan-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(37,99,235,0.1);
      border: 1px solid rgba(37,99,235,0.25);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 24px;
    }
    .plan-pill.plan-pro {
      background: rgba(124,58,237,0.12);
      border-color: rgba(124,58,237,0.3);
    }
    .plan-pill.plan-agency {
      background: rgba(245,158,11,0.08);
      border-color: rgba(245,158,11,0.25);
    }
    .plan-pill-icon { font-size: 1.1rem; }
    .plan-pill-info { flex: 1; }
    .plan-pill-name { font-size: 0.85rem; font-weight: 700; color: var(--white); }
    .plan-pill-desc { font-size: 0.75rem; color: var(--muted); }
    .plan-pill-change { font-size: 0.75rem; color: var(--blue2); cursor: pointer; white-space: nowrap; }
    .plan-pill-change:hover { color: var(--white); }

    .auth-field {
      margin-bottom: 14px;
    }
    .auth-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .auth-field input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 0.9rem;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .auth-field input::placeholder { color: #475569; }
    .auth-field input:focus {
      border-color: rgba(37,99,235,0.6);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .auth-field-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .auth-terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
    }
    .auth-terms input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }
    .auth-terms label {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
      cursor: pointer;
    }
    .auth-terms a { color: var(--blue2); transition: color 0.2s; }
    .auth-terms a:hover { color: var(--white); }
    .auth-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: var(--white);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(37,99,235,0.35);
      font-family: inherit;
    }
    .auth-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(37,99,235,0.5);
    }
    .auth-submit:active { transform: none; }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .auth-free-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 10px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .auth-divider span {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .auth-bottom {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 20px;
    }
    .auth-bottom a { color: var(--blue2); font-weight: 600; transition: color 0.2s; }
    .auth-bottom a:hover { color: var(--white); }
    .auth-error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #f87171;
      margin-bottom: 16px;
    }
    .auth-error.visible { display: block; }
    .pw-strength {
      height: 3px;
      border-radius: 2px;
      margin-top: 6px;
      background: var(--border);
      overflow: hidden;
    }
    .pw-strength-bar {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }
  </style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">eureach<span class="dot">.</span>eu</a>
    <div class="nav-cta">
      <a href="signin.html" class="btn btn-ghost">Sign in</a>
    </div>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-blob-1"></div>
  <div class="auth-blob-2"></div>

  <div class="auth-card">
    <div class="auth-logo">eureach<span>.</span>eu</div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Free forever. No credit card needed.</p>

    <div class="plan-pill" id="plan-pill">
      <div class="plan-pill-icon" id="plan-icon">🚀</div>
      <div class="plan-pill-info">
        <div class="plan-pill-name" id="plan-name">Free Plan</div>
        <div class="plan-pill-desc" id="plan-desc">2 articles · 10 lead searches / month</div>
      </div>
      <a href="membership.html" class="plan-pill-change">Change plan →</a>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="signup-form" onsubmit="handleSignup(event)">
      <input type="hidden" id="selected-plan" value="free">

      <div class="auth-field-row-2">
        <div class="auth-field">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first_name" placeholder="Maria" required autocomplete="given-name">
        </div>
        <div class="auth-field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last_name" placeholder="Papadaki" autocomplete="family-name">
        </div>
      </div>

      <div class="auth-field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" oninput="checkStrength(this.value)">
        <div class="pw-strength"><div class="pw-strength-bar" id="pw-bar"></div></div>
      </div>

      <div class="auth-terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a></label>
      </div>

      <button type="submit" class="auth-submit" id="submit-btn">Create free account →</button>
      <p class="auth-free-note">No credit card required · Cancel anytime</p>

    </form>

    <div class="auth-divider"><span>already have an account?</span></div>

    <div class="auth-bottom">
      <a href="signin.html">Sign in to your account →</a>
    </div>
  </div>
</main>

<script>
const PLANS = {
  free:    { name: 'Free Plan',    desc: '2 articles · 10 lead searches / month', icon: '🚀', cls: '' },
  starter: { name: 'Starter — €29/mo', desc: '20 articles · 50 lead searches / month', icon: '⚡', cls: '' },
  pro:     { name: 'Pro — €79/mo',     desc: '100 articles · 300 searches · All languages', icon: '✦', cls: 'plan-pro' },
  agency:  { name: 'Agency — €199/mo', desc: 'Unlimited everything · 5 seats · White-label', icon: '🏢', cls: 'plan-agency' },
};

function applyPlan(plan) {
  const p = PLANS[plan] || PLANS.free;
  document.getElementById('plan-name').textContent = p.name;
  document.getElementById('plan-desc').textContent = p.desc;
  document.getElementById('plan-icon').textContent = p.icon;
  document.getElementById('selected-plan').value = plan;
  const pill = document.getElementById('plan-pill');
  pill.className = 'plan-pill ' + p.cls;
  const btn = document.getElementById('submit-btn');
  btn.textContent = plan === 'free' ? 'Create free account →' : `Start ${p.name.split(' — ')[0]} →`;
}

function checkStrength(val) {
  const bar = document.getElementById('pw-bar');
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const colors = ['', '#ef4444', '#f59e0b', '#3b82f6', '#22c55e'];
  const widths = ['0%', '25%', '50%', '75%', '100%'];
  bar.style.width = widths[score];
  bar.style.background = colors[score];
}

async function handleSignup(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('auth-error');

  const payload = {
    first_name: document.getElementById('first-name').value.trim(),
    last_name:  document.getElementById('last-name').value.trim(),
    email:      document.getElementById('email').value.trim(),
    password:   document.getElementById('password').value,
    plan:       document.getElementById('selected-plan').value,
  };

  if (payload.password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account…';
  errEl.classList.remove('visible');

  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Sign up failed');
    location.href = 'leads.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('visible');
    btn.disabled = false;
    const plan = document.getElementById('selected-plan').value;
    btn.textContent = plan === 'free' ? 'Create free account →' : 'Create account →';
  }
}

// Read plan from URL
const urlPlan = new URLSearchParams(location.search).get('plan') || 'free';
applyPlan(urlPlan);

window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
});
</script>
<script src="/js/api.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Visibility Audit — eureach.eu</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: var(--navy); color: var(--text); min-height: 100vh; font-family: inherit; }

    .share-nav {
      background: var(--navy2);
      border-bottom: 1px solid var(--border);
      padding: 0;
    }
    .share-nav-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .share-logo { font-size: 1.05rem; font-weight: 800; color: var(--white); text-decoration: none; }
    .share-logo span { color: var(--blue2); }
    .share-cta { font-size: 0.78rem; color: var(--muted); }
    .share-cta a { color: var(--blue2); text-decoration: none; }

    .share-page {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 24px 60px;
    }

    .share-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37,99,235,0.12);
      border: 1px solid rgba(37,99,235,0.25);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.75rem;
      color: var(--blue2);
      font-weight: 600;
      margin-bottom: 20px;
    }

    .share-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 4px;
    }

    .share-url {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .share-url a { color: var(--muted); text-decoration: none; }

    .share-industry {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--glass2);
      border-radius: 6px;
      display: inline-block;
      padding: 3px 10px;
      margin-bottom: 28px;
    }

    .share-score-row {
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 24px;
    }

    .share-score-num {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
    }
    .share-score-num.score-green  { color: #4ade80; }
    .share-score-num.score-orange { color: #fbbf24; }
    .share-score-num.score-red    { color: #f87171; }

    .share-score-denom {
      font-size: 1.4rem;
      color: var(--muted);
      font-weight: 500;
      align-self: flex-end;
      padding-bottom: 10px;
    }

    .share-score-desc { flex: 1; }
    .share-score-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .share-score-blurb {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.5;
    }

    .share-section {
      margin-bottom: 24px;
    }

    .share-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .share-breakdown-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: var(--text);
    }
    .share-breakdown-row span:first-child { width: 148px; flex-shrink: 0; }
    .share-bar-track { flex: 1; height: 7px; background: var(--glass2); border-radius: 4px; overflow: hidden; }
    .share-bar-fill { height: 100%; border-radius: 4px; }
    .share-bar-fill.score-green  { background: #4ade80; }
    .share-bar-fill.score-orange { background: #fbbf24; }
    .share-bar-fill.score-red    { background: #f87171; }
    .share-bd-val { width: 30px; text-align: right; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; }
    .score-green  { color: #4ade80; }
    .score-orange { color: #fbbf24; }
    .score-red    { color: #f87171; }

    .share-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .share-list li {
      font-size: 0.85rem;
      color: var(--text);
      padding: 9px 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      line-height: 1.4;
    }
    .share-list.recs li::before { content: "→ "; color: var(--blue2); font-weight: 700; }

    .share-footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: gap;
      gap: 16px;
    }
    .share-footer-text { font-size: 0.8rem; color: var(--muted); }
    .share-footer-text strong { color: var(--white); }
    .share-footer-cta a {
      font-size: 0.82rem;
      color: var(--blue2);
      text-decoration: none;
      font-weight: 600;
    }

    .share-views {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 16px 0 0;
      padding: 10px 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: inline-block;
    }

    .share-list.strengths li::before  { content: "✓ "; color: #4ade80; font-weight: 700; }
    .share-list.weaknesses li::before { content: "✗ "; color: #f87171; font-weight: 700; }

    .share-loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .share-error {
      text-align: center;
      padding: 80px 20px;
    }
    .share-error-icon { font-size: 3rem; margin-bottom: 16px; }
    .share-error-title { font-size: 1.1rem; font-weight: 700; color: var(--white); margin-bottom: 8px; }
    .share-error-sub   { font-size: 0.85rem; color: var(--muted); }

    @media (max-width: 500px) {
      .share-score-row { flex-direction: column; align-items: flex-start; gap: 12px; }
      .share-score-num { font-size: 3.5rem; }
    }
  </style>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>

<nav class="share-nav">
  <div class="share-nav-inner">
    <a href="/index.html" class="share-logo">eureach<span>.eu</span></a>
    <div class="share-cta">Want this for your business? <a href="/signup.html">Try eureach free →</a></div>
  </div>
</nav>

<div class="share-page" id="share-page">
  <div class="share-loading" id="share-loading">Loading audit report…</div>
</div>

<script>
  const BREAKDOWN_LABELS = {
    ai_visibility:      "AI Visibility",
    content_quality:    "Content Quality",
    local_seo:          "Local SEO",
    schema_markup:      "Schema Markup",
    citation_readiness: "Citation Readiness",
  };

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = String(s || "");
    return d.innerHTML;
  }

  function scoreColor(n) {
    if (n >= 70) return "score-green";
    if (n >= 40) return "score-orange";
    return "score-red";
  }

  function scoreBlurb(n) {
    if (n >= 80) return "This business has strong AI search visibility and is well-positioned to appear in ChatGPT, Perplexity, and Google AI results.";
    if (n >= 60) return "This business has moderate AI search visibility. With some improvements, it could significantly increase its presence in AI-powered search results.";
    if (n >= 40) return "This business has limited AI search visibility. There are clear opportunities to improve how AI search engines discover and cite this business.";
    return "This business has weak AI search visibility and is largely invisible to AI-powered search engines. Immediate improvements are recommended.";
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  }

  async function loadShare() {
    const token = location.pathname.split("/").pop();
    if (!token) { showError(); return; }

    // Try standalone audit endpoint first, fall back to competitor share
    try {
      let res  = await fetch(`/api/audit/share/${token}`);
      if (res.ok) {
        const data = await res.json();
        renderStandaloneReport(data.audit);
        return;
      }
    } catch {}

    try {
      const res  = await fetch(`/api/competitor/share/${token}`);
      const data = await res.json();
      if (!res.ok) { showError(); return; }
      renderCompetitorReport(data.competitor);
    } catch {
      showError();
    }
  }

  // Render standalone audit (from /api/audit/share/:token)
  function renderStandaloneReport(audit) {
    if (!audit) { showError(); return; }

    const score  = audit.score;
    const clsNum = scoreColor(score);
    const bd     = audit.breakdown || {};

    document.title = `AI Visibility Audit — ${audit.businessName} — eureach.eu`;

    const breakdownRows = Object.keys(BREAKDOWN_LABELS).filter(k => bd[k] !== undefined).map(k => {
      const val = bd[k];
      const cls = scoreColor(val);
      return `
      <div class="share-breakdown-row">
        <span>${BREAKDOWN_LABELS[k]}</span>
        <div class="share-bar-track"><div class="share-bar-fill ${cls}" style="width:${val}%"></div></div>
        <span class="share-bd-val ${cls}">${val}</span>
      </div>`;
    }).join("");

    const listHTML = (arr, cls) => arr && arr.length
      ? `<ul class="share-list ${cls}">${arr.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`
      : "";

    document.getElementById("share-page").innerHTML = `
    <div class="share-badge">📊 AI Visibility Audit Report</div>
    <div class="share-title">${esc(audit.businessName)}</div>
    ${audit.businessUrl ? `<div class="share-url"><a href="https://${esc(audit.businessUrl)}" target="_blank" rel="noopener">${esc(audit.businessUrl)}</a></div>` : ""}
    ${audit.industry ? `<div class="share-industry">${esc(audit.industry.replace(/_/g, " "))}</div>` : ""}

    <div class="share-score-row">
      <span class="share-score-num ${clsNum}">${score}</span>
      <span class="share-score-denom">/100</span>
      <div class="share-score-desc">
        <div class="share-score-label">AI Visibility Score</div>
        <div class="share-score-blurb">${scoreBlurb(score)}</div>
      </div>
    </div>

    ${breakdownRows ? `<div class="share-section"><div class="share-section-title">Score Breakdown</div>${breakdownRows}</div>` : ""}

    ${(audit.strengths||[]).length ? `<div class="share-section"><div class="share-section-title">Strengths</div>${listHTML(audit.strengths,"strengths")}</div>` : ""}
    ${(audit.weaknesses||[]).length ? `<div class="share-section"><div class="share-section-title">Weaknesses</div>${listHTML(audit.weaknesses,"weaknesses")}</div>` : ""}
    ${(audit.recommendations||[]).length ? `<div class="share-section"><div class="share-section-title">Recommendations</div>${listHTML(audit.recommendations,"recs")}</div>` : ""}

    <div class="share-views">
      <span>👁 This report has been viewed ${audit.shareViews || 0} time${audit.shareViews !== 1 ? "s" : ""}</span>
    </div>

    <div class="share-footer">
      <div class="share-footer-text">
        Audited by <strong>eureach.eu</strong> on ${fmtDate(audit.createdAt)}
      </div>
      <div class="share-footer-cta">
        <a href="/signup.html">Get your free AI Visibility Audit →</a>
      </div>
    </div>`;
  }

  // Render competitor-based audit (legacy — from /api/competitor/share/:token)
  function renderCompetitorReport(comp) {
    const snap  = comp.snapshots && comp.snapshots.length ? comp.snapshots[comp.snapshots.length - 1] : null;
    if (!snap)  { showError("No audit data available for this link."); return; }

    const score   = snap.score;
    const clsNum  = scoreColor(score);
    const bd      = snap.breakdown || {};

    document.title = `AI Visibility Audit — ${comp.competitorName} — eureach.eu`;

    const breakdownRows = Object.keys(BREAKDOWN_LABELS).filter(k => bd[k] !== undefined).map(k => {
      const val = bd[k];
      const cls = scoreColor(val);
      return `
      <div class="share-breakdown-row">
        <span>${BREAKDOWN_LABELS[k]}</span>
        <div class="share-bar-track"><div class="share-bar-fill ${cls}" style="width:${val}%"></div></div>
        <span class="share-bd-val ${cls}">${val}</span>
      </div>`;
    }).join("");

    const listHTML = (arr, cls) => arr && arr.length
      ? `<ul class="share-list ${cls}">${arr.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`
      : "";

    document.getElementById("share-page").innerHTML = `
    <div class="share-badge">📊 AI Visibility Audit Report</div>
    <div class="share-title">${esc(comp.competitorName)}</div>
    ${comp.competitorUrl ? `<div class="share-url"><a href="https://${esc(comp.competitorUrl)}" target="_blank" rel="noopener">${esc(comp.competitorUrl)}</a></div>` : ""}
    ${comp.industry ? `<div class="share-industry">${esc(comp.industry.replace(/_/g, " "))}</div>` : ""}

    <div class="share-score-row">
      <span class="share-score-num ${clsNum}">${score}</span>
      <span class="share-score-denom">/100</span>
      <div class="share-score-desc">
        <div class="share-score-label">AI Visibility Score</div>
        <div class="share-score-blurb">${scoreBlurb(score)}</div>
      </div>
    </div>

    ${breakdownRows ? `<div class="share-section"><div class="share-section-title">Score Breakdown</div>${breakdownRows}</div>` : ""}

    ${snap.recommendations && snap.recommendations.length ? `
    <div class="share-section">
      <div class="share-section-title">Recommendations to Improve</div>
      ${listHTML(snap.recommendations, "recs")}
    </div>` : ""}

    <div class="share-footer">
      <div class="share-footer-text">
        Audited by <strong>eureach.eu</strong> on ${fmtDate(snap.date)}
      </div>
      <div class="share-footer-cta">
        <a href="/signup.html">Get your free AI Visibility Audit →</a>
      </div>
    </div>`;
  }

  function showError(msg) {
    document.getElementById("share-page").innerHTML = `
    <div class="share-error">
      <div class="share-error-icon">🔍</div>
      <div class="share-error-title">Report not found</div>
      <div class="share-error-sub">${msg || "This audit link has expired or does not exist."}</div>
    </div>`;
  }

  loadShare();
</script>
</body>
</html>

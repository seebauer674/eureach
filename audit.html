</head>

    <a href="index.html" class="nav-logo">eureach<span class="dot">.</span>eu</a>
    <div class="nav-links">
      <div class="nav-dropdown">
        <button class="nav-dropdown-toggle" data-i18n="nav.tools">
          Tools
          <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
        </button>
        <div class="nav-dropdown-menu">
          <div class="nav-dropdown-menu-inner">
            <a href="leads.html"><span class="ndm-icon">🔍</span><span data-i18n="nav.leadFinder">Lead Finder</span></a>
            <a href="articles.html"><span class="ndm-icon">✍️</span><span data-i18n="nav.articles">Articles</span></a>

            <a href="citations.html"><span class="ndm-icon">🔗</span><span data-i18n="nav.citations">Citations</span></a>

            <a href="youtube.html"><span class="ndm-icon">🎥</span><span data-i18n="nav.creatorPortal">Creator Portal</span></a>
            <a href="youtube-join.html"><span class="ndm-icon">✨</span><span data-i18n="nav.becomeCreator">Become a Creator</span></a>
          </div>
        </div>
      </div>
      <a href="audit.html" data-i18n="navAudit" style="color:var(--white)">AI Audit</a>
      <a href="/dashboard.html" style="color:var(--accent);font-weight:600">Dashboard</a>
    </div>
    <div class="nav-lang">
      <button class="lang-btn" data-lang="el" onclick="setLang('el')" title="Ελληνικά">🇬🇷</button>
      <button class="lang-btn" data-lang="de" onclick="setLang('de')" title="Deutsch">🇩🇪</button>

      <a href="settings.html" class="nav-profile-btn" id="nav-profile-btn" title="Profile">?</a>

    </div>
  </div>
  <a href="/coach" class="nav-coach-link" style="font-size:0.8rem;color:var(--accent)">Coach<span class="coach-nav-dot" id="coach-nav-dot" style="display:none"></span></a>
      <a id="nav-creator-link" href="youtube.html" style="display:none">Creator Portal</a>
</nav>

<!-- ── PAGE ─────────────────────────────────────────────── -->
<div class="au-page">

  <!-- ── Sidebar ─────────────────────────────────────── -->
  <aside class="au-sidebar">
    <div class="au-sidebar-title" data-i18n="auTitle">AI Visibility Audit</div>

    <!-- Limit banner (hidden by default) -->
    <div class="au-limit-banner" id="au-limit-banner" style="display:none">
      <span data-i18n="auLimitBanner">🔒 Free plan: 1 lifetime audit used.</span>
      <a href="membership.html" data-i18n="auLimitLink">Upgrade for unlimited audits →</a>
    </div>

    <!-- Audit form -->
    <form class="au-form" id="au-form" autocomplete="off">
      <div class="au-field">
        <label for="au-name" data-i18n="auBusName">Business Name *</label>
        <input class="au-input" type="text" id="au-name" name="businessName"
          placeholder="e.g. Nikos Bakery Athens" required>
      </div>
      <div class="au-field">
        <label for="au-url"><span data-i18n="auBusUrl">Website URL</span> <span style="font-weight:400;text-transform:none;letter-spacing:0" data-i18n="auUrlNote">(optional)</span></label>
        <input class="au-input" type="text" id="au-url" name="businessUrl"
          placeholder="e.g. nikosbakery.gr">
      </div>
      <div class="au-field">
        <label for="au-industry"><span data-i18n="auIndustry">Industry</span> <span style="font-weight:400;text-transform:none;letter-spacing:0" data-i18n="auIndustryNote">(optional)</span></label>
        <select class="au-input au-select" id="au-industry" name="industry">
          <option value="" data-i18n="auSelectInd">— Select industry —</option>
          <option value="healthcare" data-i18n="auIndHealth">Healthcare &amp; Medical</option>
          <option value="hospitality" data-i18n="auIndHospital">Hospitality &amp; Tourism</option>
          <option value="legal" data-i18n="auIndLegal">Legal Services</option>
          <option value="real_estate" data-i18n="auIndRealEst">Real Estate</option>
          <option value="professional_services" data-i18n="auIndProf">Professional Services</option>
          <option value="retail" data-i18n="auIndRetail">Retail &amp; E-commerce</option>
          <option value="food_beverage" data-i18n="auIndFood">Food &amp; Beverage</option>
          <option value="construction" data-i18n="auIndConst">Construction &amp; Trades</option>
          <option value="education" data-i18n="auIndEdu">Education &amp; Training</option>
          <option value="fitness_wellness" data-i18n="auIndFitness">Fitness &amp; Wellness</option>
          <option value="technology" data-i18n="auIndTech">Technology</option>
          <option value="other" data-i18n="auIndOther">Other</option>
        </select>
      </div>
      <div class="au-form-err" id="au-form-err"></div>
      <button type="submit" class="au-run-btn" id="au-run-btn" data-i18n="auRunBtn">Run Audit →</button>
    </form>

    <!-- History -->
    <div class="au-history-title" data-i18n="auHistory">Your Audits</div>
    <div id="au-history-list"></div>
  </aside>

  <!-- ── Main ───────────────────────────────────────── -->
  <main class="au-main" id="au-main">
    <!-- populated by audit.js -->
  </main>

</div>

<script src="js/audit.js?v=5"></script>
<script src="/js/api.js?v=5"></script>
<script src="/js/trial-banner.js"></script>
<script src="js/nav-init.js"></script>
<!-- au-url-prefill --><script>
(function(){
  var p=new URLSearchParams(location.search);
  var d=p.get("domain");
  if(d){var el=document.getElementById("au-url"); if(el&&!el.value) el.value=d;}
})();
</script>
</body>
</html>
